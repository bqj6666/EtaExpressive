name: Eta Build (Debug Signing)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建测试用 Release APK（debug 签名）
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 接受 Android SDK 许可证
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0"

      - name: 生成本地 debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/debug.keystore
          ETA_RELEASE_STORE_PASSWORD: android
          ETA_RELEASE_KEY_ALIAS: androiddebugkey
          ETA_RELEASE_KEY_PASSWORD: android
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-test-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
